<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 다크 라운드 배경 -->
  <rect width="32" height="32" rx="7" fill="#1a1a1a"/>

  <!-- 연필 (중심 16,16 기준 -45° 회전) -->
  <g transform="rotate(-45, 16, 16)">
    <!-- 지우개 (붉은 계열) -->
    <rect x="12" y="4" width="8" height="4" rx="1.5" fill="#f87171"/>
    <!-- 금속 밴드 -->
    <rect x="12" y="8" width="8" height="2" fill="#d1d5db"/>
    <!-- 연필 몸통 (주황) -->
    <rect x="12" y="10" width="8" height="12" fill="#f59e0b"/>
    <!-- 몸통 중앙 음영 선 -->
    <rect x="15.5" y="10" width="1.5" height="12" fill="#d97706" opacity="0.5"/>
    <!-- 나무 부분 (연한 주황) -->
    <polygon points="12,22 20,22 18.5,25.5 13.5,25.5" fill="#fbbf24"/>
    <!-- 흑연 팁 (어두운 색) -->
    <polygon points="13.5,25.5 18.5,25.5 16,29.5" fill="#292929"/>
  </g>
</svg>
